<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tableau de bord — Arbres dynamiques</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='16' cy='9' r='3'/%3E%3Ccircle cx='10' cy='18' r='3'/%3E%3Ccircle cx='22' cy='18' r='3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=20261027a">
</head>
<body>
  <main class="page admin">
    <section class="hero">
      <h1 data-i18n-html="adm.title"></h1>
      <p data-i18n="adm.lead"></p>
    </section>

    <form id="login" class="adm-card adm-login">
      <label for="pw" data-i18n="adm.password"></label>
      <div class="row">
        <input type="password" id="pw" autocomplete="current-password" required>
        <button class="btn primary" type="submit" data-i18n="adm.enter"></button>
      </div>
      <p class="err" id="loginErr"></p>
    </form>

    <div id="board" hidden>
      <section class="adm-card">
        <div class="adm-head">
          <h2 data-i18n="adm.votes"></h2>
          <div class="row">
            <button class="btn ghost" id="refresh" data-i18n="adm.refresh"></button>
            <button class="btn" id="resetAll" data-i18n="adm.resetAll"></button>
          </div>
        </div>
        <table class="adm-table" id="votes"></table>
      </section>
      <section class="adm-card">
        <div class="adm-head"><h2 data-i18n="adm.reports"></h2></div>
        <div id="reports"></div>
      </section>
    </div>
  </main>

  <script src="js/i18n.js?v=20261027a"></script>
  <script src="js/config.js?v=20261027a"></script>
  <script src="js/feedback.js?v=20261027a"></script>
  <script src="js/catalog.js?v=20261027a"></script>
  <script src="js/admin.js?v=20261027a"></script>
</body>
</html>
